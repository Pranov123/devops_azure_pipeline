---
# Deploys (or updates) the application on Kubernetes.
# Called by the Jenkins "Deploy" stage:
#   ansible-playbook deploy.yml -e image_tag=<tag> -e build_number=<n>
# Registry login comes from the ACR_USER / ACR_PASS environment variables (Jenkins credential),
# cluster access from K8S_AUTH_KUBECONFIG.

- name: Deploy devops-azure-pipeline to Kubernetes
  hosts: k8s_control
  gather_facts: false

  vars:
    k8s_namespace: devops-cia2
    app_name: devops-app
    registry: pranovdevopsacr.azurecr.io
    image_repo: "{{ registry }}/devops-azure-pipeline"
    image: "{{ image_repo }}:{{ image_tag }}"
    app_version: "1.0.0"
    app_message: "Deployed automatically by Jenkins CI/CD"
    build_number: "manual"
    service_type: NodePort
    manifest_dir: "{{ playbook_dir }}/../k8s"
    acr_user: "{{ lookup('env', 'ACR_USER') }}"
    acr_pass: "{{ lookup('env', 'ACR_PASS') }}"

  tasks:
    - name: Check required inputs
      ansible.builtin.assert:
        that:
          - image_tag is defined and image_tag | length > 0
          - acr_user | length > 0
          - acr_pass | length > 0
        fail_msg: "image_tag (-e image_tag=...) and ACR_USER / ACR_PASS environment variables are required"
        quiet: true

    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        template: "{{ manifest_dir }}/namespace.yaml"

    - name: Create or update the registry pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: acr-pull-secret
            namespace: "{{ k8s_namespace }}"
          data:
            .dockerconfigjson: "{{ docker_config | to_json | b64encode }}"
      vars:
        docker_config:
          auths: "{{ {registry: {'username': acr_user, 'password': acr_pass, 'auth': (acr_user ~ ':' ~ acr_pass) | b64encode}} }}"
      no_log: true

    - name: Apply deployment
      kubernetes.core.k8s:
        state: present
        template: "{{ manifest_dir }}/deployment.yaml"

    - name: Apply service
      kubernetes.core.k8s:
        state: present
        template: "{{ manifest_dir }}/service.yaml"

    - name: Wait for the rollout to finish
      kubernetes.core.k8s_info:
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ k8s_namespace }}"
      register: deployment
      until:
        - deployment.resources | length > 0
        - (deployment.resources[0].status.observedGeneration | default(0)) >= deployment.resources[0].metadata.generation
        - (deployment.resources[0].status.updatedReplicas | default(0)) == deployment.resources[0].spec.replicas
        - (deployment.resources[0].status.availableReplicas | default(0)) == deployment.resources[0].spec.replicas
        - (deployment.resources[0].status.replicas | default(0)) == deployment.resources[0].spec.replicas
      retries: 40
      delay: 5

    - name: Remove previous smoke test job
      kubernetes.core.k8s:
        state: absent
        kind: Job
        name: smoke-test
        namespace: "{{ k8s_namespace }}"
        wait: true

    # Calls the service from inside the cluster, so the check works the same on Minikube and AKS
    - name: Run smoke test against the service
      kubernetes.core.k8s:
        state: present
        wait: true
        wait_condition:
          type: Complete
          status: "True"
        wait_timeout: 120
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: smoke-test
            namespace: "{{ k8s_namespace }}"
          spec:
            backoffLimit: 3
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.10.1
                    args: ["-sSf", "--retry", "5", "--retry-connrefused", "http://{{ app_name }}.{{ k8s_namespace }}.svc/api/info"]

    - name: Read smoke test response
      kubernetes.core.k8s_log:
        namespace: "{{ k8s_namespace }}"
        label_selectors:
          - job-name=smoke-test
      register: smoke

    - name: Verify the new build is the one serving traffic
      ansible.builtin.assert:
        that:
          - (smoke.log | from_json).build == build_number | string
        success_msg: "Endpoint is serving build {{ build_number }}: {{ smoke.log | trim }}"
        fail_msg: "Endpoint did not return build {{ build_number }}: {{ smoke.log | trim }}"

    # On AKS the LoadBalancer service gets a public IP from Azure
    - name: Wait for the public IP of the service
      kubernetes.core.k8s_info:
        kind: Service
        name: "{{ app_name }}"
        namespace: "{{ k8s_namespace }}"
      register: svc
      until: svc.resources[0].status.loadBalancer.ingress | default([]) | length > 0
      retries: 30
      delay: 10
      when: service_type == 'LoadBalancer'

    - name: Show the application URL
      ansible.builtin.debug:
        msg: "Application URL: http://{{ svc.resources[0].status.loadBalancer.ingress[0].ip }}/"
      when: service_type == 'LoadBalancer'
