# Rendered by Ansible (Jinja2 template): placeholder values are filled in at deploy time
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ app_name }}"
  namespace: "{{ k8s_namespace }}"
  labels:
    app: "{{ app_name }}"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: "{{ app_name }}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep the app available during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app: "{{ app_name }}"
        build: "{{ build_number }}"
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: "{{ app_name }}"
          image: "{{ image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_BUILD
              value: "{{ build_number }}"
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef: { name: welcome-config, key: APP_MESSAGE }
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/restaurant"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: restaurant-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: restaurant-db, key: password }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup (JPA + Flyway) can take over a minute on a small node; liveness and
          # readiness checks only begin once this probe has passed (allows up to 3 minutes)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
