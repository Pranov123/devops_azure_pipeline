# PostgreSQL for the restaurant app. Rendered by Ansible (Jinja2 template).
# Credentials come from the restaurant-db Secret, which Ansible creates once with a random password.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: "{{ k8s_namespace }}"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: "{{ k8s_namespace }}"
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # the volume can only be attached to one pod at a time
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: restaurant-db, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: restaurant-db, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: restaurant-db, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: "{{ k8s_namespace }}"
  labels:
    app: postgres
spec:
  type: ClusterIP   # reachable only from inside the cluster
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
