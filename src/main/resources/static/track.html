<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spice Route – Track your order</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="track">
  <header class="site-header" id="site-header"></header>

  <main>
    <h1 class="page-title">Track your order</h1>
    <p class="page-sub">Enter your order number to see live status from the kitchen.</p>

    <form class="track-search" id="track-form">
      <input id="order-id" type="number" min="1" placeholder="Order number, e.g. 12" aria-label="Order number" required>
      <button class="btn" type="submit">Track</button>
    </form>

    <div class="error-box hidden" id="track-error"></div>

    <section class="card hidden" id="order-card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">Order <span id="o-id"></span></h2>
        <span class="status-pill" id="o-status"></span>
      </div>
      <p class="page-sub" style="margin:4px 0 0" id="o-meta"></p>

      <div class="timeline" id="timeline"></div>
      <p class="error-box hidden" id="o-cancelled">This order was cancelled.</p>

      <table class="bill" id="o-items"></table>
      <p class="page-sub" style="margin:0;font-size:.85rem">Status refreshes automatically every 5 seconds.</p>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/track.js"></script>
</body>
</html>
