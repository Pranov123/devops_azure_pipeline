server.port=8080

# Overridden at deploy time through environment variables (APP_VERSION, APP_BUILD, APP_MESSAGE)
app.name=DevOps AWS Pipeline
app.version=${APP_VERSION:1.0.0}
app.build=${APP_BUILD:local}
app.message=${APP_MESSAGE:Deployed automatically by Jenkins CI/CD}

# Health endpoints used by the Kubernetes liveness and readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
