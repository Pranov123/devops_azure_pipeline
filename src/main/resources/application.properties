server.port=8080

# Version comes from pom.xml at build time; the Jenkins build number is injected at deploy time (APP_BUILD)
app.name=Spice Route
app.version=@project.version@
app.build=${APP_BUILD:local}
app.message=Authentic Indian kitchen - order online or book a table
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Database: PostgreSQL in Kubernetes (DB_URL / DB_USER / DB_PASSWORD from a Secret),
# in-memory H2 when running locally or in tests
spring.datasource.url=${DB_URL:jdbc:h2:mem:restaurant;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Schema and seed data are managed by Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoints used by the Kubernetes liveness and readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
