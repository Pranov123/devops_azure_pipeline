server.port=8080

# Version comes from pom.xml at build time; the Jenkins build number is injected at deploy time (APP_BUILD)
app.name=DevOps Azure Pipeline
app.version=@project.version@
app.build=${APP_BUILD:local}
app.message=Deployed automatically by Jenkins CI/CD

# Health endpoints used by the Kubernetes liveness and readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
